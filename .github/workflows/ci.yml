name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Check syntax with pyflakes
        run: python -m pyflakes .

      - name: Check formatting with ruff format (check only)
        run: ruff format --check .

      - name: Lint with ruff check
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Run Roadmap 4.x Macro-Mission 06.2.4-A focal contract
        run: >-
          python -m pytest -q
          tests/test_mission_closure_gate_v2_2_4_a.py
          tests/test_mission_closure_gate_v2_2_4_a_ci_contract.py
      - name: Validate generic closure policy and anti-weakening corpus
        run: >-
          python scripts/validate_mission_closure_v2.py validate-policy
          --repo-root .
          --policy docs/ROADMAP_4X_MACRO_06_MISSION_POLICY.json
          --schema docs/MISSION_CLOSURE_POLICY_SCHEMA.json
          && python -m pytest -q tests/test_mission_closure_gate_v2.py

  closure-policy-and-anti-weakening:
    name: closure-policy-and-anti-weakening
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Validate V2.1 policy
        run: >-
          python scripts/validate_mission_closure_v2_1.py validate-policy
          --repo-root .
          --policy docs/ROADMAP_4X_MACRO_06_1_MISSION_POLICY.json
          --schema docs/MISSION_CLOSURE_POLICY_SCHEMA_V2_1.json

      - name: Run V2.1 scope and chronology corpus
        run: python -m pytest -q tests/test_mission_closure_gate_v2_1.py tests/test_mission_closure_gate_v2_1_git_integration.py tests/test_mission_closure_gate_v2_1_chronology.py tests/test_mission_closure_gate_v2_1_ci_contract.py tests/test_mission_closure_gate_v2_1_reproduction.py

      - name: Run historical V1 and V2 compatibility corpus
        run: python -m pytest -q tests/test_mission_closure_gate_v2.py tests/test_mission_closure_historical_compatibility_v2_1.py

      - name: Validate V2.2 policy
        run: >-
          python scripts/validate_mission_closure_v2_2.py validate-policy
          --repo-root .
          --policy docs/ROADMAP_4X_MACRO_06_2_MISSION_POLICY.json
          --schema docs/MISSION_CLOSURE_POLICY_SCHEMA_V2_2.json

      - name: Run V2.2 terminal-authority corpus
        run: python -m pytest -q tests/test_mission_closure_gate_v2_2.py tests/test_mission_closure_gate_v2_2_git.py tests/test_mission_closure_gate_v2_2_terminal.py tests/test_mission_closure_gate_v2_2_ci_contract.py

      - name: Run historical V1, V2, V2.1 and V2.2 compatibility corpus
        run: python -m pytest -q tests/test_mission_closure_gate_v2.py tests/test_mission_closure_historical_compatibility_v2_1.py tests/test_mission_closure_historical_compatibility_v2_2.py

      - name: Validate V2.2.1 policy and content-bound profiles
        run: >-
          python scripts/run_mission_closure_v2_2_1.py validate-policy
          --policy docs/ROADMAP_4X_MACRO_06_2_1_MISSION_POLICY.json
          --schema docs/MISSION_CLOSURE_POLICY_SCHEMA_V2_2_1.json
          && python scripts/run_mission_closure_v2_2_1.py validate-profiles
          --claims docs/ROADMAP_4X_MACRO_06_2_1_CLAIM_REGISTRY.json
          --executions docs/ROADMAP_4X_MACRO_06_2_1_EXECUTION_REGISTRY.json

      - name: Run V2.2.1 assurance corpus
        run: >-
          python -m pytest -q
          tests/test_mission_closure_gate_v2_2_1.py
          tests/test_mission_closure_gate_v2_2_1_git.py
          tests/test_mission_closure_gate_v2_2_1_ci_contract.py

      - name: Validate V2.2.2 raw-evidence closure policy and profiles
        run: >-
          python scripts/run_mission_closure_v2_2_2.py validate-policy
          --policy docs/ROADMAP_4X_MACRO_06_2_2_MISSION_POLICY.json
          --schema docs/MISSION_CLOSURE_POLICY_SCHEMA_V2_2_2.json
          && python scripts/run_mission_closure_v2_2_2.py validate-profiles
          --claims docs/ROADMAP_4X_MACRO_06_2_2_CLAIM_REGISTRY.json
          --executions docs/ROADMAP_4X_MACRO_06_2_2_EXECUTION_REGISTRY.json

      - name: Run V2.2.2 raw-evidence assurance corpus
        run: >-
          python -m pytest -q
          tests/test_mission_closure_gate_v2_2_2.py
          tests/test_mission_closure_gate_v2_2_2_ci_contract.py

      - name: Validate V2.2.3 semantic proof contract
        run: >-
          python scripts/validate_mission_closure_v2_2_3.py --focal

      - name: Run V2.2.3 semantic proof assurance corpus
        run: >-
          python -m pytest -q
          tests/test_mission_closure_gate_v2_2_3.py
          tests/test_mission_closure_gate_v2_2_3_ci_contract.py

      - name: Reproduce V2.2.2 semantic red corpus
        run: >-
          python scripts/run_mission_closure_v2_2_3_red_reproduction.py
          --output /tmp/ia-core-v223-red-reproduction.json

      - name: Execute exact Level A corpus
        run: >-
          python scripts/run_mission_closure_v2_2_1.py level-a
          --repo .
          --output-dir /tmp/ia-core-v221-level-a
          --claim-profile-sha256 8321513ac62ac527698a6c3c58872718ca6f63273b128109541a622db223bf10
          --execution-profile-sha256 70ed55f85d4aff2793941f9ce4e32e48f04f64ce9a023ff90beba9a6af8779d8
